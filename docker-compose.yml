services:
  web:
    build: .
    container_name: ergo_server
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - .:/app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/app_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PROVIDER=minio
      - STORAGE_ENDPOINT=http://minio:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      - db
      - redis
      - minio
    restart: unless-stopped
    networks:
      - backend
      - frontend

  db:
    image: postgres:18
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432"
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:8
    container_name: redis_cache
    volumes:
      - redis_data:/data
    ports:
      - "6379"
    restart: unless-stopped
    networks:
      - backend

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - backend

  minio-proxy:
    image: nginx:alpine
    container_name: minio_proxy
    depends_on:
      - minio
    ports:
      - "9000:9000"
    volumes:
      - ./minio-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
